<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر | الأسطورة ليو ميسي</title>
    <!-- مكتبة HLS.js لتشغيل البثوث المباشرة باحترافية -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --primary: #22c55e; --gold: #f59e0b; --bg: #030712; }
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; text-align: center; padding: 20px; 
        }
        
        .header { margin-top: 10px; margin-bottom: 20px; }
        .badge { 
            background: rgba(34, 197, 94, 0.15); color: var(--primary); 
            padding: 8px 20px; border-radius: 20px; font-weight: bold; 
            border: 1px solid var(--primary); display: inline-block; 
            margin-bottom: 10px; font-size: 1rem; animation: pulse 2s infinite;
        }
        
        h1 { font-size: 2.2rem; margin: 0; color: #fff; }
        h1 span { color: var(--gold); }
        
        .player-container {
            width: 100%;
            max-width: 850px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(34, 197, 94, 0.2);
            border: 1px solid #1f2937;
            margin-bottom: 30px;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        .rights { margin-top: auto; padding: 15px; font-size: 0.85rem; color: #4b5563; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge">🔴 بث مباشر وحصري</div>
        <h1>مباراة <span>الأسطورة ليو ميسي</span></h1>
    </div>

    <!-- حاوية مشغل الفيديو -->
    <div class="player-container">
        <video id="video" controls autoplay></video>
    </div>

    <div class="rights">
        جميع الحقوق محفوظة &copy; 2026 | الأسطورة ليو ميسي
    </div>

    <script>
        var video = document.getElementById('video');
        
        // 🔴 ضع رابط m3u8 الذي استخرجته من الترافيك هنا بين علامتي التنصيص:
        var videoSrc = 'ضع_رابط_m3u8_هنا';

        if (Hls.isSupported()) {
            var hls = new Hls();
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play();
            });
        }
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // لدعم متصفحات سفاري وأجهزة أبل
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
