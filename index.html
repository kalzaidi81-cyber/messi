<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر | الأسطورة ليو ميسي</title>
    <style>
        :root { --primary: #22c55e; --gold: #f59e0b; --bg: #030712; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; text-align: center; padding: 10px; }
        
        .header { margin-top: 15px; margin-bottom: 15px; }
        .badge { background: rgba(34, 197, 94, 0.15); color: var(--primary); padding: 6px 16px; border-radius: 20px; font-weight: bold; border: 1px solid var(--primary); display: inline-block; margin-bottom: 10px; font-size: 0.9rem; }
        
        h1 { font-size: 1.8rem; margin: 0; color: #fff; }
        h1 span { color: var(--gold); }
        
        .player-container {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #1f2937;
            margin-bottom: 20px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .backup-btn {
            background: #1e293b;
            color: #94a3b8;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid #334155;
            transition: 0.2s;
        }
        .backup-btn:hover { background: #334155; color: #fff; }

        .rights { margin-top: auto; padding: 15px; font-size: 0.8rem; color: #4b5563; }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge">🔴 بث مباشر بدون تقطيع</div>
        <h1>مباراة <span>الأسطورة ليو ميسي</span></h1>
    </div>

    <!-- مشغل البث المباشر المضمن -->
    <div class="player-container">
        <iframe src="https://vidsrc.me/embed/tv" allowfullscreen scrolling="no"></iframe>
    </div>

    <!-- خيار احتياطي في حال القناة على تلجرام -->
    <a href="https://t.me/MessiWorldAr" target="_blank" class="backup-btn">
        📱 سيرفر احتياطي (قناة التلجرام)
    </a>

    <div class="rights">
        جميع الحقوق محفوظة &copy; 2026 | الأسطورة ليو ميسي
    </div>

</body>
</html>
