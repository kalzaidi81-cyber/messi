<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر | الأسطورة ليو ميسي</title>
    <style>
        :root { --primary: #22c55e; --gold: #f59e0b; --bg: #030712; }
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; text-align: center; padding: 10px; 
        }
        
        .header { margin-top: 10px; margin-bottom: 15px; }
        .badge { 
            background: rgba(34, 197, 94, 0.15); color: var(--primary); 
            padding: 6px 16px; border-radius: 20px; font-weight: bold; 
            border: 1px solid var(--primary); display: inline-block; 
            margin-bottom: 8px; font-size: 0.9rem; 
        }
        
        h1 { font-size: 1.8rem; margin: 0; color: #fff; }
        h1 span { color: var(--gold); }
        
        .telegram-container {
            width: 100%;
            max-width: 600px;
            background: #111827;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #1f2937;
            margin-bottom: 20px;
        }

        .rights { margin-top: auto; padding: 15px; font-size: 0.8rem; color: #4b5563; }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge">🔴 البث المباشر يعمل الآن داخل الموقع</div>
        <h1>مباراة <span>الأسطورة ليو ميسي</span></h1>
    </div>

    <!-- أداة تليجرام الرسمية المدمجة لعرض القناة والبث مباشرة -->
    <div class="telegram-container">
        <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-chat="MessiWorldAr" data-width="100%" data-height="450" data-dark="1"></script>
    </div>

    <div class="rights">
        جميع الحقوق محفوظة &copy; 2026 | الأسطورة ليو ميسي
    </div>

</body>
</html>
