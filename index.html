<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر الحصري | الأسطورة ليو ميسي</title>
    <style>
        :root { 
            --primary: #22c55e; 
            --primary-glow: rgba(34, 197, 94, 0.4);
            --gold: #f59e0b; 
            --bg: #020617; 
            --card-bg: #0f172a;
        }
        * { box-sizing: border-box; }
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; text-align: center; padding: 10px; 
        }
        
        .header { margin: 10px 0; }
        .badge { 
            background: rgba(34, 197, 94, 0.15); color: var(--primary); 
            padding: 6px 18px; border-radius: 20px; font-weight: bold; 
            border: 1px solid var(--primary); display: inline-block; 
            margin-bottom: 8px; font-size: 0.85rem; animation: pulse 2s infinite;
        }
        
        h1 { font-size: 1.7rem; margin: 0; color: #fff; }
        h1 span { color: var(--gold); }
        
        .stream-box {
            width: 100%;
            max-width: 850px;
            aspect-ratio: 16 / 9;
            background: var(--card-bg);
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px var(--primary-glow);
            border: 1px solid #1e293b;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .live-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 5;
        }

        .pulse-icon {
            width: 70px; height: 70px;
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid var(--primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem;
            margin-bottom: 15px;
            animation: ring 1.5s infinite;
        }

        .stream-box h3 {
            font-size: 1.4rem;
            margin: 0 0 8px 0;
            color: #f8fafc;
        }

        .stream-box p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
            max-width: 400px;
        }

        .btn-play {
            background: linear-gradient(135deg, #15803d, #22c55e);
            color: #fff;
            padding: 14px 35px;
            font-size: 1.15rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 10px 25px rgba(34, 197, 94, 0.5);
            transition: 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-play:hover { transform: scale(1.05); box-shadow: 0 15px 35px rgba(34, 197, 94, 0.8); }

        .rights { margin-top: auto; padding: 10px; font-size: 0.75rem; color: #475569; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        @keyframes ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge">🔴 البث المباشر انطلق الآن</div>
        <h1>مباراة <span>الأسطورة ليو ميسي</span></h1>
    </div>

    <!-- مشغل البث الدمار الشامل (بدون شاشات بيضاء) -->
    <div class="stream-box">
        <div class="live-screen">
            <div class="pulse-icon">📺</div>
            <h3>مشغل البث الحي جاهز</h3>
            <p>اضغط على زر التشغيل أدناه لفتح البث المباشر للمباراة بجودة خرافية وبدون أي تقطيع:</p>
            <a href="https://t.me/MessiWorldAr?livestream" target="_blank" class="btn-play">
                <span>▶ تشغيل البث الآن</span>
            </a>
        </div>
    </div>

    <div class="rights">
        جميع الحقوق محفوظة &copy; 2026 | الأسطورة ليو ميسي
    </div>

</body>
</html>
