<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البث المباشر الحصري | الأسطورة ليو ميسي</title>
    <style>
        :root { --primary: #22c55e; --gold: #f59e0b; --bg: #030712; }
        * { box-sizing: border-box; }
        body { 
            margin: 0; background: var(--bg); color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh; text-align: center; padding: 15px; 
        }
        
        .header { margin-top: 10px; margin-bottom: 15px; }
        .badge { 
            background: rgba(34, 197, 94, 0.15); color: var(--primary); 
            padding: 6px 18px; border-radius: 20px; font-weight: bold; 
            border: 1px solid var(--primary); display: inline-block; 
            margin-bottom: 8px; font-size: 0.9rem; animation: pulse 2s infinite;
        }
        
        h1 { font-size: 2rem; margin: 0; color: #fff; }
        h1 span { color: var(--gold); }
        
        .player-wrapper {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 9;
            background: #0b0f19;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(34, 197, 94, 0.15);
            border: 1px solid #1f2937;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }

        .stream-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(3, 7, 18, 0.96), rgba(15, 23, 42, 0.96));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            padding: 25px;
            text-align: center;
        }

        .stream-overlay h3 {
            font-size: 1.6rem;
            margin: 0 0 10px 0;
            color: #f3f4f6;
        }

        .stream-overlay p {
            color: #9ca3af;
            font-size: 1rem;
            margin-bottom: 25px;
            max-width: 480px;
        }

        .btn-launch {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            color: #fff;
            padding: 16px 40px;
            font-size: 1.25rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.4);
            transition: 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-launch:hover { transform: scale(1.05); box-shadow: 0 12px 35px rgba(34, 197, 94, 0.6); }

        .rights { margin-top: auto; padding: 10px; font-size: 0.8rem; color: #4b5563; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="badge">🔴 بث مباشر حصري الآن</div>
        <h1>مباراة <span>الأسطورة ليو ميسي</span></h1>
    </div>

    <!-- مشغل البث المدمج -->
    <div class="player-wrapper">
        <div class="stream-overlay">
            <h3>🎬 البث المباشر جاهز في القناة</h3>
            <p>انقر أدناه لفتح البث المباشر للمباراة بجودة عالية وبدون تقطيع:</p>
            <a href="https://t.me/MessiWorldAr?livestream" target="_blank" class="btn-launch">
                <span>▶ اضغط هنا لمشاهدة البث الفوري</span>
            </a>
        </div>
    </div>

    <div class="rights">
        جميع الحقوق محفوظة &copy; 2026 | الأسطورة ليو ميسي
    </div>

</body>
</html>
